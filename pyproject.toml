[project]
name = "local-readable"
version = "0.1.0"
description = "Local-only, layout-preserving academic PDF translator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pymupdf>=1.25,<2",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
skill = [
  "pdfplumber>=0.11.10,<0.12",
]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
local-readable = "local_readable.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_readable"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
